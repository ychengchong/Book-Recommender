[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "book-recommender"
version = "0.1.0"
description = "Semantic book discovery with category and emotional tone filters"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gradio==5.9.1",
    "langchain-chroma==0.1.4",
    "langchain-openai==0.2.12",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
research = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "kagglehub==0.3.5",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "jupyterlab==4.3.3",
    # Transformers 4.47 conflicts with Chroma 0.5's tokenizers constraint.
    "transformers==4.46.3",
    "torch==2.5.1",
    "tqdm==4.67.1",
    "langchain-community==0.3.12",
    "langchain-text-splitters==0.3.3",
]

[dependency-groups]
dev = ["ipykernel==6.29.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_recommender = ["assets/*.svg"]

[tool.uv]
exclude-newer = "2025-01-01T00:00:00Z"
